    <script>
      (function () {
        var guardado = localStorage.getItem('theme')
        var prefiereOscuro =
          guardado === 'dark' ||
          (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (prefiereOscuro) document.documentElement.classList.add('dark')
      })()
    </script>
